<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基础 Agent 流程演示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>基础 Agent：运行过程可视化</h1>
    <p class="intro">输入任务，观察 Agent 如何规划、调用工具、记录记忆并生成回答。</p>
    <form id="task-form">
      <label for="task">任务</label>
      <input id="task" value="计算 (12 + 3) * 2" autocomplete="off">
      <button type="submit">运行</button>
    </form>
    <div class="examples" aria-label="示例任务">
      <button type="button" data-example="什么是 agent？">知识查询</button>
      <button type="button" data-example="计算 (12 + 3) * 2">计算</button>
      <button type="button" data-example="帮我开始学习">普通对话</button>
    </div>
    <label class="llm-switch"><input id="llm-simulation" type="checkbox"> 启用大模型模拟（离线，无需 API Key）</label>
    <section class="controls" aria-label="播放控制">
      <button id="play" type="button">自动播放</button>
      <button id="pause" type="button">暂停</button>
      <button id="previous" type="button">上一步</button>
      <button id="next" type="button">下一步</button>
      <button id="reset" type="button">重置</button>
    </section>
    <p id="status" class="status" aria-live="polite">尚未运行任务。</p>
    <figure class="flow-wrap" aria-label="Agent 模块流转图">
      <svg id="flow" viewBox="0 0 1180 560" role="img" aria-label="Agent 模块和数据流动路径">
        <defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="crystal"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-opacity=".28"/><feSpecularLighting surfaceScale="4" specularConstant=".7" specularExponent="18" lighting-color="white" result="shine"><feDistantLight azimuth="225" elevation="50"/></feSpecularLighting><feComposite in="shine" in2="SourceAlpha" operator="in" result="light"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="light"/></feMerge></filter></defs>
        <path id="用户输入|规划器" class="flow-link link-1" d="M200 110 H280"/>
        <path id="规划器|工具注册表" class="flow-link link-2" d="M430 110 H510"/>
        <path id="规划器|大模型模拟" class="flow-link link-3" d="M330 140 V260"/>
        <path id="大模型模拟|规划器" class="flow-link link-4" d="M405 260 V140"/>
        <path id="工具注册表|计算器" class="flow-link link-5" d="M585 140 V230 H780"/>
        <path id="工具注册表|知识库" class="flow-link link-6" d="M660 110 V360 H980"/>
        <path id="计算器|记忆" class="flow-link link-7" d="M855 260 V450 H730"/>
        <path id="知识库|记忆" class="flow-link link-8" d="M980 360 H1030 V450 H730"/>
        <path id="工具注册表|记忆" class="flow-link link-9" d="M585 140 V420"/>
        <path id="记忆|大模型模拟" class="flow-link link-10" d="M650 420 V340 H430 V290"/>
        <path id="大模型模拟|最终回答" class="flow-link link-11" d="M280 290 H180 V420 H275"/>
        <path id="记忆|最终回答" class="flow-link link-12" d="M570 450 H350"/>
        <g class="module node-user" data-module="用户输入"><rect x="50" y="80" width="150" height="60"/><text x="125" y="116">💬 用户输入</text></g>
        <g class="module node-planner" data-module="规划器"><rect x="280" y="80" width="150" height="60"/><text x="355" y="116">🧭 规划器</text></g>
        <g class="module node-registry" data-module="工具注册表"><rect x="510" y="80" width="150" height="60"/><text x="585" y="116">工具注册表</text></g>
        <g class="module node-llm" data-module="大模型模拟"><rect x="280" y="260" width="150" height="60"/><text x="355" y="296">大模型模拟</text></g>
        <g class="module node-calculator" data-module="计算器"><rect x="780" y="200" width="150" height="60"/><text x="855" y="236">计算器</text></g>
        <g class="module node-knowledge" data-module="知识库"><rect x="980" y="330" width="150" height="60"/><text x="1055" y="366">知识库</text></g>
        <g class="module node-memory" data-module="记忆"><rect x="570" y="420" width="160" height="60"/><text x="650" y="456">记忆</text></g>
        <g class="module node-answer" data-module="最终回答"><rect x="200" y="420" width="150" height="60"/><text x="275" y="456">最终回答</text></g>
        <circle id="packet" r="8" visibility="hidden" filter="url(#glow)"/>
        <text id="packet-label" visibility="hidden" text-anchor="middle"></text>
      </svg>
    </figure>
    <section class="detail" aria-label="当前传递的变量">
      <h2>连线上传递的变量</h2>
      <p id="variables">等待运行。</p>
    </section>
    <section class="detail" aria-label="最终回答">
      <h2>最终回答</h2>
      <p id="answer">等待运行。</p>
    </section>
  </main>
  <dialog id="code-dialog"><button id="close-code" type="button">关闭</button><h2 id="code-title"></h2><p id="code-file"></p><pre><code id="code-content"></code></pre></dialog>
  <script src="app.js"></script>
</body>
</html>
